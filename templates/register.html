<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — AI Comment Moderator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
 
<div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Register to start checking and moderating comments.</p>
 
    <form method="POST" class="input-row" style="flex-direction: column;">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
 
    {% if error %}
        <p style="color: #e03131; margin-top: 12px;">{{ error }}</p>
    {% endif %}
 
    <p style="margin-top: 20px;">
        Already have an account? <a href="/login">Login</a>
    </p>
</div>
 
</body>
</html>
